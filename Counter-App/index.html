
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="counter-card">
        <h1>Counter App</h1>
        <p class="subtitle">Count anything you like!</p>

        <div id="count">0</div>

        <div class="buttons">
            <button class="decrease" onclick="decreaseCount()">−</button>
            <button class="reset" onclick="resetCount()">Reset</button>
            <button class="increase" onclick="increaseCount()">+</button>
        </div>

        <p class="message" id="message">Ready to count?</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
